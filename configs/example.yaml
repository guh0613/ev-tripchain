seed: 42

case:
  name: ieee33  # improved IEEE33; use case33bw for the raw open-tie pandapower feeder
  load_scale: 1.0

time:
  step_minutes: 15
  n_steps: 96
  n_days: 2

hosting_capacity:
  scenarios: 20
  risk_tolerance: 0.05
  common_random_numbers: true
  parallel_workers: 0
  risk_metric: p_hat
  n_max: 3000
  binary_search:
    max_iter: 14
    min_step: 10
    initial_hi: 128

constraints:
  hard:
    vmin_pu: 0.95
    vmax_pu: 1.05
    line_loading_max_percent: 100.0
    trafo_loading_max_percent: 100.0
  soft:
    nominal_voltage_pu: 1.0

ev:
  charge_power_kw: 7.2
  sessions_per_vehicle_mean: 1.0
  duration_minutes_mean: 120
  duration_minutes_std: 40
  start_time_mix:
    - weight: 0.7
      mean: "19:00"
      std_minutes: 90
    - weight: 0.2
      mean: "09:00"
      std_minutes: 30
    - weight: 0.1
      mean: "20:30"
      std_minutes: 45

strategy:
  name: uncontrolled  # uncontrolled | nearest | navigation | ordered
  ordered:
    window_start: "22:00"
    window_end: "06:00"
  navigation:
    candidate_k: 6
    distance_limit_m: 2000
    distance_beta: 1.0
